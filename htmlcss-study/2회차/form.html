<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>설문조사 양식</title>
</head>
<body>
    <header>
    <h1>설문조사 양식</h1>
    <p>모든 항목에 빠짐없이 체크해주십시오.</p>
    </header>
    <hr>
    <main>
    <form action="">
        <fieldset>
            <legend>개인정보</legend>
            <label for="name">이름</label>
            <input type="text" id="name" name="name"placeholder="이름을 입력하세요">
            <br>
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력하세요">
        </fieldset>
        <fieldset>
            <legend>설문</legend>

            <p>연령대가 어떻게 되십니까?</p>
            <input type="radio" id="teen" name="age">
            <label for="teen">10대</label>
            <input type="radio" id="twenty" name="age">
            <label for="twenty">20대</label>
            <input type="radio" id="thirty" name="age">
            <label for="thirsty">30대</label>
            <input type="radio" id="forty" name="age">
            <label for="forty">40대</label>
            <input type="radio" id="fifty" name="age">
            <label for="fifty">50대</label>
            <input type="radio" id="others" name="age">
            <label for="others">그 외</label>

            <p>학원을 선택 시 그 기준은 어떻게 되시나요?</p>
            <input type="checkbox" id="position" name="academy">
            <label for="position">위치</label>
            <input type="checkbox" id="price" name="academy">
            <label for="position">학원비</label>
            <input type="checkbox" id="teacher" name="academy">
            <label for="position">강사</label>
            <input type="checkbox" id="infra" name="academy">
            <label for="position">시설</label>
        </fieldset>
        <fieldset>
            <legend>기타 의견</legend>
            <textarea name="comment" rows="3" cols="30"></textarea>
        </fieldset>
        <input type="submit" value="제출">   
    </form>
    </main>
    <hr>
    <footer>
    <p>입력하느라 수고하셨습니다.</p>
    </footer>
</body>
</html>
